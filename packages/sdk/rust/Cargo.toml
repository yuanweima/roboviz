[package]
name = "roboviz-sdk"
version = "0.1.0"
edition = "2021"
description = "Rust SDK for RoboViz remote control"
license = "MIT"
repository = "https://github.com/yuanweima/roboviz"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
thiserror = "1.0"

[dev-dependencies]
tokio-test = "0.4"
