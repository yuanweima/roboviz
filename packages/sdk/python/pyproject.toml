[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "roboviz"
version = "0.1.0"
description = "Python SDK for RoboViz remote control"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "websockets>=12.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["roboviz"]
