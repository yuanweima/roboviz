[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "roboviz"
version = "0.1.0"
description = "Python SDK for RoboViz - Robot Visualization"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
# Legacy client needs websocket-client
legacy = [
    "websocket-client>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["roboviz"]

# Include bundled viewer if it exists
[tool.hatch.build.targets.wheel.sources]
"roboviz" = "roboviz"
