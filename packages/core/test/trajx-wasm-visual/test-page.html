<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>trajx-wasm 视觉测试</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #16213e;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #0f3460;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 500;
    }

    .status-badge {
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }

    .status-loading { background: #f39c12; color: #000; }
    .status-ready { background: #27ae60; color: #fff; }
    .status-error { background: #e74c3c; color: #fff; }

    .main-container {
      flex: 1;
      display: flex;
    }

    .sidebar {
      width: 300px;
      background: #16213e;
      border-right: 1px solid #0f3460;
      padding: 16px;
      overflow-y: auto;
    }

    .sidebar h2 {
      font-size: 14px;
      color: #888;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .config-section {
      margin-bottom: 20px;
    }

    .config-item {
      background: #1a1a2e;
      padding: 10px 12px;
      border-radius: 6px;
      margin-bottom: 8px;
      font-size: 13px;
    }

    .config-item label {
      color: #888;
      display: block;
      margin-bottom: 4px;
    }

    .config-item .value {
      color: #4fc3f7;
      font-family: 'Monaco', 'Menlo', monospace;
      word-break: break-all;
    }

    .viewport {
      flex: 1;
      position: relative;
      background: #0a0a0a;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
    }

    .info-overlay {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(0,0,0,0.7);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 12px;
      max-width: 300px;
    }

    .info-overlay h3 {
      color: #4fc3f7;
      margin-bottom: 8px;
    }

    .checkpoints {
      margin-top: 12px;
    }

    .checkpoint {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .checkpoint:last-child {
      border-bottom: none;
    }

    .checkpoint-status {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .checkpoint-pending { background: #444; }
    .checkpoint-checking { background: #f39c12; animation: pulse 1s infinite; }
    .checkpoint-passed { background: #27ae60; }
    .checkpoint-failed { background: #e74c3c; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .console-panel {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 150px;
      background: rgba(0,0,0,0.9);
      border-top: 1px solid #333;
      overflow-y: auto;
      font-family: 'Monaco', 'Menlo', monospace;
      font-size: 11px;
      padding: 8px 12px;
    }

    .console-line {
      padding: 2px 0;
      white-space: pre-wrap;
    }

    .console-info { color: #4fc3f7; }
    .console-success { color: #27ae60; }
    .console-warn { color: #f39c12; }
    .console-error { color: #e74c3c; }
  </style>
</head>
<body data-test-status="loading">
  <div class="header">
    <h1>trajx-wasm 视觉测试</h1>
    <span id="status-badge" class="status-badge status-loading">Loading...</span>
  </div>

  <div class="main-container">
    <div class="sidebar">
      <div class="config-section">
        <h2>测试信息</h2>
        <div class="config-item">
          <label>测试名称</label>
          <div class="value" id="test-name">-</div>
        </div>
        <div class="config-item">
          <label>测试类别</label>
          <div class="value" id="test-category">-</div>
        </div>
        <div class="config-item">
          <label>描述</label>
          <div class="value" id="test-description">-</div>
        </div>
      </div>

      <div class="config-section">
        <h2>测试参数</h2>
        <div id="params-container"></div>
      </div>

      <div class="config-section">
        <h2>检查点</h2>
        <div id="checkpoints-container"></div>
      </div>
    </div>

    <div class="viewport">
      <div id="canvas-container"></div>

      <div class="info-overlay">
        <h3 id="overlay-title">等待测试配置...</h3>
        <div id="overlay-content">
          <p>请通过 URL 参数传入测试配置</p>
          <p style="color:#888;margin-top:8px;font-size:11px;">
            例如: ?config={"jointAngles":[0,0,0,0,0,0]}
          </p>
        </div>
      </div>

      <div class="console-panel" id="console-panel"></div>
    </div>
  </div>

  <script type="module">
    // 日志系统
    const consolePanel = document.getElementById('console-panel');
    function log(message, level = 'info') {
      const line = document.createElement('div');
      line.className = `console-line console-${level}`;
      line.textContent = `[${new Date().toISOString().substr(11, 8)}] ${message}`;
      consolePanel.appendChild(line);
      consolePanel.scrollTop = consolePanel.scrollHeight;

      // 同时输出到真实控制台
      console[level === 'error' ? 'error' : level === 'warn' ? 'warn' : 'log'](message);
    }

    // 状态更新
    function updateStatus(status, text) {
      const badge = document.getElementById('status-badge');
      badge.textContent = text;
      badge.className = `status-badge status-${status}`;
      document.body.setAttribute('data-test-status', status);
    }

    // 解析 URL 参数
    function parseUrlParams() {
      const params = new URLSearchParams(window.location.search);
      const configStr = params.get('config');
      const testName = params.get('testName') || 'unnamed';

      if (!configStr) {
        return null;
      }

      try {
        return {
          testName,
          config: JSON.parse(configStr)
        };
      } catch (e) {
        log(`配置解析失败: ${e.message}`, 'error');
        return null;
      }
    }

    // 渲染参数
    function renderParams(config) {
      const container = document.getElementById('params-container');
      container.innerHTML = '';

      for (const [key, value] of Object.entries(config)) {
        const item = document.createElement('div');
        item.className = 'config-item';
        item.innerHTML = `
          <label>${key}</label>
          <div class="value">${JSON.stringify(value)}</div>
        `;
        container.appendChild(item);
      }
    }

    // 渲染检查点
    function renderCheckpoints(checkpoints) {
      const container = document.getElementById('checkpoints-container');
      container.innerHTML = '';

      if (!checkpoints || checkpoints.length === 0) {
        container.innerHTML = '<div class="config-item">无检查点定义</div>';
        return;
      }

      for (const cp of checkpoints) {
        const item = document.createElement('div');
        item.className = 'checkpoint';
        item.innerHTML = `
          <div class="checkpoint-status checkpoint-pending" id="cp-${cp.name}"></div>
          <div>
            <div>${cp.name}</div>
            <div style="color:#888;font-size:11px">${cp.question}</div>
          </div>
        `;
        container.appendChild(item);
      }
    }

    // 测试函数占位符 - 需要实际实现
    window.testFK = async (config) => {
      log('执行 FK 测试...', 'info');
      log(`关节角度: ${JSON.stringify(config.jointAngles)}`, 'info');
      // TODO: 实际调用 trajx-wasm FK 计算并渲染
      await new Promise(r => setTimeout(r, 1000));
      log('FK 测试完成', 'success');
    };

    window.testIK = async (config) => {
      log('执行 IK 测试...', 'info');
      log(`目标位姿: ${JSON.stringify(config.targetPose)}`, 'info');
      // TODO: 实际调用 trajx-wasm IK 求解并渲染
      await new Promise(r => setTimeout(r, 1000));
      log('IK 测试完成', 'success');
    };

    window.testCollision = async (config) => {
      log('执行碰撞检测测试...', 'info');
      log(`障碍物数量: ${config.obstacles?.length || 0}`, 'info');
      // TODO: 实际调用 trajx-wasm 碰撞检测并渲染
      await new Promise(r => setTimeout(r, 1000));
      log('碰撞检测测试完成', 'success');
    };

    window.testPlanning = async (config) => {
      log('执行路径规划测试...', 'info');
      // TODO: 实际调用 trajx-wasm 路径规划并渲染
      await new Promise(r => setTimeout(r, 1000));
      log('路径规划测试完成', 'success');
    };

    window.testBatch = async (config) => {
      log('执行批量测试...', 'info');
      // TODO: 实际调用 trajx-wasm 批量操作
      await new Promise(r => setTimeout(r, 1000));
      log('批量测试完成', 'success');
    };

    // 主执行逻辑
    async function main() {
      log('测试页面初始化...', 'info');

      const parsed = parseUrlParams();
      if (!parsed) {
        log('未提供测试配置，等待配置...', 'warn');
        updateStatus('loading', 'Waiting for config');
        return;
      }

      const { testName, config } = parsed;

      // 更新 UI
      document.getElementById('test-name').textContent = testName;
      document.getElementById('overlay-title').textContent = testName;
      renderParams(config);

      log(`加载测试配置: ${testName}`, 'info');

      try {
        // 确定测试类别
        let testFn = window.testFK;
        let category = 'fk';

        if (config.targetPose) {
          testFn = window.testIK;
          category = 'ik';
        } else if (config.obstacles) {
          testFn = window.testCollision;
          category = 'collision';
        } else if (config.planningParams) {
          testFn = window.testPlanning;
          category = 'planning';
        } else if (config.batch) {
          testFn = window.testBatch;
          category = 'batch';
        }

        document.getElementById('test-category').textContent = category;

        updateStatus('loading', 'Running test...');
        log(`开始执行 ${category} 测试`, 'info');

        await testFn(config);

        updateStatus('ready', 'Ready');
        log('测试执行完成，页面就绪', 'success');

        // 标记页面就绪（用于 Chrome MCP 等待）
        document.body.setAttribute('data-test-status', 'ready');

      } catch (error) {
        log(`测试执行失败: ${error.message}`, 'error');
        updateStatus('error', 'Error');
        document.body.setAttribute('data-test-status', 'error');
        document.body.setAttribute('data-test-error', error.message);
      }
    }

    // 启动
    main();
  </script>
</body>
</html>
